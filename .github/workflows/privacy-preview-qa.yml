name: B2C Privacy Preview viewport QA (P4, no release)

on:
  pull_request:
    paths:
      - "app/[locale]/privacy/page.tsx"
      - "components/layout/StickyHeader.tsx"
      - "components/layout/MobileStickyCta.tsx"
      - "scripts/qa-privacy-preview.mjs"
      - ".github/workflows/privacy-preview-qa.yml"

permissions:
  contents: read

jobs:
  preview-browser-qa:
    if: github.head_ref == 'fix/b2c-privacy-navigation-only-po-approved-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup pinned Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - name: Install locked webapp dependencies
        run: npm ci
      - name: Install isolated browser driver, no lockfile changes
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Verify Preview browser behavior only, no production release
        run: node scripts/qa-privacy-preview.mjs
        env:
          PREVIEW_BASE_URL: https://visage-ai-webapp-9drc-5ku7ue8sr-kyos-projects-0964257b.vercel.app
